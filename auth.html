<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KALIDO HD — Login / Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0f;
    --panel: #0d0d1a;
    --gold: #d4a853;
    --gold-light: #e8c777;
    --gold-dark: #b8922e;
    --text: #ffffff;
    --text-muted: #9ca3af;
    --border: rgba(255,255,255,0.08);
    --error: #e5484d;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 20%, rgba(212,168,83,0.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(212,168,83,0.06), transparent 40%),
      var(--bg);
    font-family:'Inter', sans-serif;
    color: var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }

  .card{
    width:100%;
    max-width:420px;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:40px 32px;
    position:relative;
    overflow:hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .card::before{
    content:'';
    position:absolute;
    top:-60px; left:-60px;
    width:180px; height:180px;
    background: radial-gradient(circle, rgba(212,168,83,0.25), transparent 70%);
    filter: blur(10px);
  }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    margin-bottom:28px;
    position:relative;
  }
  .brand .logo{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size:28px;
    letter-spacing:2px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .brand .badge{
    font-family:'Orbitron', sans-serif;
    font-size:11px;
    letter-spacing:3px;
    color: var(--gold);
    border:1px solid var(--gold-dark);
    padding:2px 10px;
    border-radius:999px;
  }
  .brand .tagline{
    color: var(--text-muted);
    font-size:12px;
    letter-spacing:1px;
    margin-top:4px;
  }

  h1{
    font-family:'Orbitron', sans-serif;
    font-size:20px;
    text-align:center;
    margin: 0 0 24px;
    font-weight:700;
  }

  form{ display:none; flex-direction:column; gap:16px; }
  form.active{ display:flex; }

  label{
    font-size:13px;
    color: var(--text-muted);
    margin-bottom:6px;
    display:block;
  }
  .field{ position:relative; }
  input{
    width:100%;
    background:#111827;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    color: var(--text);
    font-size:14px;
    outline:none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus{
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212,168,83,0.15);
  }
  .toggle-pass{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color: var(--text-muted);
    cursor:pointer;
    font-size:12px;
    padding:0;
  }
  .toggle-pass:hover{ color: var(--gold); }

  .btn{
    margin-top:6px;
    padding:13px;
    border-radius:10px;
    border:none;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    color:#0a0a0f;
    transition: transform .15s, box-shadow .15s;
    position:relative;
  }
  .btn:hover{ transform: translateY(-1px); box-shadow: 0 8px 20px rgba(212,168,83,0.25); }
  .btn:disabled{ opacity:.6; cursor:not-allowed; transform:none; box-shadow:none; }

  .switch-line{
    text-align:center;
    font-size:13px;
    color: var(--text-muted);
    margin-top:22px;
  }
  .switch-line a{
    color: var(--gold);
    text-decoration:none;
    font-weight:600;
    cursor:pointer;
  }
  .switch-line a:hover{ text-decoration:underline; }

  .msg{
    display:none;
    font-size:13px;
    padding:10px 12px;
    border-radius:8px;
    margin-bottom:16px;
    line-height:1.5;
  }
  .msg.error{
    display:block;
    background: rgba(229,72,77,0.12);
    border:1px solid rgba(229,72,77,0.35);
    color:#ff9a9d;
  }
  .msg.success{
    display:block;
    background: rgba(212,168,83,0.12);
    border:1px solid rgba(212,168,83,0.35);
    color: var(--gold-light);
  }

  .forgot{
    text-align:right;
    font-size:12px;
    color: var(--text-muted);
    text-decoration:none;
    margin-top:-6px;
  }
  .forgot:hover{ color: var(--gold); }

  .spinner{
    display:inline-block;
    width:14px; height:14px;
    border:2px solid rgba(10,10,15,0.3);
    border-top-color:#0a0a0f;
    border-radius:50%;
    animation: spin .7s linear infinite;
    vertical-align:middle;
    margin-right:6px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="logo">KALIDO</div>
    <div class="badge">HD</div>
    <div class="tagline">Learn • Create • Earn</div>
  </div>

  <div id="globalMsg" class="msg"></div>

  <!-- LOGIN FORM -->
  <form id="loginForm" class="active">
    <h1>Log in to your account</h1>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" required />
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" required />
      <button type="button" class="toggle-pass" data-target="loginPassword">Show</button>
    </div>
    <a href="#" class="forgot">Forgot password?</a>
    <button type="submit" class="btn" id="loginBtn">Login</button>
    <div class="switch-line">
      Don't have an account? <a id="goSignup">Sign Up</a>
    </div>
  </form>

  <!-- SIGNUP FORM -->
  <form id="signupForm">
    <h1>Create your account</h1>
    <div class="field">
      <label for="signupName">Full name</label>
      <input type="text" id="signupName" placeholder="Your name" required />
    </div>
    <div class="field">
      <label for="signupEmail">Email</label>
      <input type="email" id="signupEmail" placeholder="you@example.com" required />
    </div>
    <div class="field">
      <label for="signupPhone">Phone</label>
      <input type="tel" id="signupPhone" placeholder="09xxxxxxxx" required />
    </div>
    <div class="field">
      <label for="signupPassword">Password</label>
      <input type="password" id="signupPassword" placeholder="At least 6 characters" required minlength="6" />
      <button type="button" class="toggle-pass" data-target="signupPassword">Show</button>
    </div>
    <button type="submit" class="btn" id="signupBtn">Sign Up</button>
    <div class="switch-line">
      Already have an account? <a id="goLogin">Login</a>
    </div>
  </form>
</div>

<script>
  /* ============================================================
     SUPABASE CONFIG — fill these in with your project's values
     (Supabase → Project Settings → API)
  ============================================================ */
  const SUPABASE_URL = "https://cuqhstnpfszpvnhtnnkk.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR_ANON_PUBLIC_KEY_HERE";

  // Loaded from CDN below — see the <script> tag at the bottom of <head> alternative,
  // here we load it right before use.
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginForm = document.getElementById('loginForm');
  const signupForm = document.getElementById('signupForm');
  const goSignup = document.getElementById('goSignup');
  const goLogin = document.getElementById('goLogin');
  const globalMsg = document.getElementById('globalMsg');

  function showMsg(text, type){
    globalMsg.textContent = text;
    globalMsg.className = 'msg ' + type;
  }
  function clearMsg(){
    globalMsg.className = 'msg';
    globalMsg.textContent = '';
  }

  goSignup.addEventListener('click', (e) => {
    e.preventDefault();
    clearMsg();
    loginForm.classList.remove('active');
    signupForm.classList.add('active');
  });
  goLogin.addEventListener('click', (e) => {
    e.preventDefault();
    clearMsg();
    signupForm.classList.remove('active');
    loginForm.classList.add('active');
  });

  // Show/hide password toggles
  document.querySelectorAll('.toggle-pass').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.target);
      const isPass = target.type === 'password';
      target.type = isPass ? 'text' : 'password';
      btn.textContent = isPass ? 'Hide' : 'Show';
    });
  });

  function setLoading(button, loading, label){
    button.disabled = loading;
    button.innerHTML = loading ? '<span class="spinner"></span>Please wait…' : label;
  }

  // ---------- SIGN UP ----------
  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsg();
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const phone = document.getElementById('signupPhone').value.trim();
    const password = document.getElementById('signupPassword').value;
    const btn = document.getElementById('signupBtn');

    setLoading(btn, true, 'Sign Up');
    try {
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: name, phone: phone }
        }
      });
      if (error) throw error;

      // Insert a matching profile row (id must match auth user's id)
      if (data.user) {
        await supabaseClient.from('users').insert([
          { id: data.user.id, name, email, phone }
        ]);
      }

      showMsg('We sent a verification link to your email. Please confirm your account before logging in.', 'success');
      signupForm.reset();
    } catch (err) {
      showMsg(err.message || 'Something went wrong. Please try again.', 'error');
    } finally {
      setLoading(btn, false, 'Sign Up');
    }
  });

  // ---------- LOGIN ----------
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsg();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');

    setLoading(btn, true, 'Login');
    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        if (error.message.toLowerCase().includes('confirm')) {
          throw new Error('Please verify your email before logging in.');
        }
        throw error;
      }
      showMsg('Login successful. Redirecting…', 'success');
      setTimeout(() => {
        window.location.href = '/mobile-repair.html'; // change to your target page
      }, 800);
    } catch (err) {
      showMsg(err.message || 'Invalid email or password.', 'error');
    } finally {
      setLoading(btn, false, 'Login');
    }
  });

  // Keep user logged in across reloads
  supabaseClient.auth.onAuthStateChange((event, session) => {
    // You can hook additional logic here if needed
  });
</script>

</body>
</html>
